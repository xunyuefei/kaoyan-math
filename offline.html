<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离线研读模式 · 考研数学 SOP 题解站</title>
<style>
  :root {
    --bg-primary: #0f172a;
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --accent-blue: #3b82f6;
    --card-bg: rgba(30, 41, 59, 0.7);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 20%, #1e3a8a 0%, #0f172a 70%);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }
  .offline-card {
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 40px 24px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .icon-ring {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(59, 130, 246, 0.15);
    border: 1px solid rgba(59, 130, 246, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
  p { font-size: 14px; line-height: 1.6; color: var(--text-muted); margin-bottom: 24px; }
  .action-btn {
    display: inline-block;
    width: 100%;
    padding: 12px 20px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.2s;
    margin-bottom: 10px;
  }
  .action-btn:active { opacity: 0.85; }
  .secondary-btn {
    background: rgba(255,255,255,0.08);
    color: var(--text-primary);
  }
</style>
</head>
<body>
<div class="offline-card">
  <div class="icon-ring">📶</div>
  <h1>当前处于离线研读模式</h1>
  <p>您暂时断开了网络连接。考研数学知识库 PWA 已将您此前访问过的核心章节、题解与个人星标备忘完整缓存在本地，断网不影响正常刷题！</p>
  <button class="action-btn" onclick="window.location.reload()">🔄 刷新重试连接</button>
  <a href="./" class="action-btn secondary-btn">🏠 返回知识库主页</a>
</div>
</body>
</html>
