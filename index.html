<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>考研数学 SOP 题解站</title>

<body>

  <!-- ===== Header ===== -->
  <header class="p-header" id="header">
    <div class="p-header-left">
      <button class="p-menu-btn" id="menuBtn" aria-label="展开或收起目录" title="展开或收起目录 (快捷键 M)">
        <span class="p-menu-icon">☰</span>
        <span class="p-menu-text">目录</span>
      </button>
      <div class="p-brand">
        <span class="p-brand-logo">📐</span>
        <span class="p-brand-title">考研数学 SOP</span>
        <span class="p-badge-preview">SOP 2.0</span>
      </div>
      <nav class="p-subject-tabs" id="subjectTabs">
        <!-- Tabs injected by preview.js -->
      </nav>
    </div>
    <div class="p-header-right">
      <button class="p-action-btn" id="btnInstallPwa" style="display:none; background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-weight: 600;" title="📲 安装到手机桌面 (独立App模式)">
        <span>📲 安装</span>
      </button>
      <a href="classic.html" class="p-action-btn p-btn-official" title="切换回经典单流旧版">📜 经典旧版</a>
      <button class="p-action-btn" id="themeToggle" aria-label="切换暗色/亮色模式" title="切换暗色/亮色模式">
        <span id="themeIcon">☀️</span>
      </button>
    </div>
  </header>

  <!-- ===== Layout ===== -->
  <div class="p-layout">
    <!-- Sidebar -->
    <aside class="p-sidebar" id="sidebar">
      <div class="p-sidebar-header">
        <div class="p-sidebar-title-box">
          <span class="p-sidebar-title">题解导航目录</span>
        </div>
        <div class="p-sidebar-header-controls">
          <button class="p-sidebar-mini-action" id="toggleAllGroupsBtn" title="全部折叠/展开章节">📁 全部折叠</button>
          <button class="p-sidebar-close-btn" id="closeSidebarBtn" title="收起目录 (快捷键 ESC)">✕</button>
        </div>
      </div>
      <div class="p-sidebar-search">
        <div class="p-search-wrapper">
          <span class="p-search-icon">🔍</span>
          <input type="text" class="p-search-input" id="searchInput" placeholder="实时搜索题号、关键词、题型…">
        </div>
      </div>
      <div class="p-sidebar-actions">
        <div class="p-sidebar-dimension-tabs" id="sidebarDimensionTabs">
          <button class="p-dim-tab active" data-dim="chapter" title="按知识点章节分类">📚 章节</button>
          <button class="p-dim-tab" data-dim="source" title="按题集来源分类（严选题/600题/辅导讲义等）">🏷️ 题集</button>
          <button class="p-dim-tab" data-dim="date" title="按收录日期归档">📅 日期</button>
          <button class="p-dim-tab" data-dim="marks" title="星标与随手记">⭐️ 标记</button>
        </div>
        <div class="p-view-mode-tabs" id="sidebarViewMode">
          <button class="p-mode-tab active" data-mode="list" title="列表视图">列表</button>
          <button class="p-mode-tab" data-mode="grid" title="题号矩阵视图">矩阵</button>
        </div>
      </div>
      <nav class="p-sidebar-nav" id="sidebarNav">
        <!-- Date groups and items injected by preview.js -->
      </nav>
    </aside>

    <!-- Sidebar Backdrop (移动端/抽屉遮罩) -->
    <div class="p-sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main Content -->
    <main class="p-main" id="mainContent">
      <div class="p-content-toolbar">
        <div class="p-content-info">
          <h2 id="subjectTitle">高等数学 · 现代学术版</h2>
          <p id="subjectStatsText">正在载入题目列表…</p>
        </div>
        <div class="p-view-controls">
          <button class="p-control-btn" id="blindTestBtn" type="button" title="隐藏解法与手眼法，先在草稿纸上独立演算">
            <span id="blindTestIcon">🙈</span>
            <span id="blindTestText">自测做题模式</span>
          </button>
          <button class="p-control-btn" id="expandStreamBtn" type="button">
            <span>📖 展开全部</span>
          </button>
          <button class="p-control-btn" id="collapseStreamBtn" type="button">
            <span>📑 仅看题干</span>
          </button>
        </div>
      </div>

      <!-- Loading State -->
      <div class="p-loading-state" id="loadingState">
        <div class="p-spinner"></div>
        <p>正在渲染数学题解与公式…</p>
      </div>

      <!-- Cards Stream Container -->
      <div class="p-cards-stream" id="cardsStream"></div>
    </main>
  </div>

  <!-- Floating Nav Pill (快速呼出目录胶囊，对齐英语站体验) -->
  <button class="p-floating-nav-pill" id="floatingNavBtn" title="展开目录 (快捷键 M)">
    <span>📚</span>
    <span>目录</span>
  </button>

  <!-- Floating Quick Dock -->
  <div class="p-floating-dock" id="floatingDock">
    <button class="p-dock-btn" id="dockNavBtn" title="展开/收起目录 (快捷键 M)">📚</button>
    <button class="p-dock-btn" id="dockBlindBtn" title="切换自测模式">🙈</button>
    <button class="p-dock-btn" id="dockExpandBtn" title="切换全部展开/折叠">📖</button>
    <button class="p-dock-btn" id="dockTopBtn" title="返回顶部">▲</button>
  </div>

  <!-- Toast Notification -->
  <div class="p-toast" id="pToast"></div>

  <!-- Note Modal Backdrop (随手记 & 星标) -->
  <div class="p-note-modal-backdrop" id="noteModalBackdrop">
    <div class="p-note-modal">
      <div class="p-note-modal-header">
        <h3 class="p-note-modal-title">⭐️ 星标与随手记</h3>
        <button class="p-note-modal-close" id="closeNoteModalBtn" title="关闭 (ESC)">✕</button>
      </div>
      <div class="p-note-modal-body">
        <div class="p-note-priority-group">
          <label class="p-note-label">优先级 (Priority):</label>
          <div class="p-priority-options" id="priorityOptions">
            <button class="p-priority-btn" data-level="3" title="P3 最高优 (必须掌握)">💖 P3</button>
            <button class="p-priority-btn" data-level="2" title="P2 中优 (易错陷阱)">🧡 P2</button>
            <button class="p-priority-btn" data-level="1" title="P1 低优 (了解扩展)">💛 P1</button>
            <button class="p-priority-btn" data-level="0" title="取消星标">❌ 无</button>
          </div>
        </div>
        <div class="p-note-theme-group">
          <label class="p-note-label" for="noteThemeInput">主题 (Theme) <span style="font-size: 12px; color: var(--text-muted); font-weight: normal;">(如: 易错点/秒杀/计算陷阱)</span>:</label>
          <input type="text" class="p-note-theme-input" id="noteThemeInput" placeholder="输入或选择星标主题..." list="noteThemeList">
          <datalist id="noteThemeList">
            <option value="易错防线">易错防线</option>
            <option value="秒杀技巧">秒杀技巧</option>
            <option value="计算陷阱">计算陷阱</option>
            <option value="经典好题">经典好题</option>
            <option value="二刷错题">二刷错题</option>
          </datalist>
        </div>
        <div class="p-note-text-group">
          <label class="p-note-label" for="noteTextInput">随手记 (Notes):</label>
          <textarea class="p-note-textarea" id="noteTextInput" placeholder="在这里写下你的灵感或总结..."></textarea>
        </div>
      </div>
      <div class="p-note-modal-footer">
        <button class="p-note-btn p-note-cancel-btn" id="cancelNoteBtn">取消</button>
        <button class="p-note-btn p-note-save-btn" id="saveNoteBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://fastly.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://fastly.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
  <script src="preview.js?v=mu72atcc"></script>

  <!-- PWA Service Worker & Install Prompt Controller -->
  <script>
    (function() {
      // 1. 注册 Service Worker (相对路径 ./sw.js 自动兼容 GitHub Pages 子路径与 Localhost)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(function(reg) {
              console.log('[PWA-Math] Service Worker 注册成功，作用域:', reg.scope);
              
              // 自动检测新版本更新
              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA-Math] 发现新版本题解，已为您在后台静默就绪！');
                  }
                });
              });
            })
            .catch(function(err) {
              console.warn('[PWA-Math] Service Worker 注册失败:', err);
            });
        });
      }

      // 2. 捕获浏览器安装引导事件 (beforeinstallprompt)
      var deferredPrompt = null;
      var installBtn = document.getElementById('btnInstallPwa');
      var mobileBanner = document.getElementById('pwaMathMobileBanner');
      var bannerInstallBtn = document.getElementById('pwaMathBannerInstallBtn');
      var bannerCloseBtn = document.getElementById('pwaMathBannerCloseBtn');

      function triggerInstall() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted') {
            console.log('[PWA-Math] 用户已接受安装到桌面！');
          }
          deferredPrompt = null;
          if (installBtn) installBtn.style.display = 'none';
          if (mobileBanner) mobileBanner.style.display = 'none';
        });
      }

      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) {
          installBtn.style.display = 'inline-flex';
          installBtn.onclick = triggerInstall;
        }
        if (mobileBanner && !sessionStorage.getItem('pwa_math_dismissed')) {
          mobileBanner.style.display = 'flex';
          if (bannerInstallBtn) bannerInstallBtn.onclick = triggerInstall;
          if (bannerCloseBtn) bannerCloseBtn.onclick = function() {
            mobileBanner.style.display = 'none';
            sessionStorage.setItem('pwa_math_dismissed', '1');
          };
        }
      });

      window.addEventListener('appinstalled', function() {
        console.log('[PWA-Math] 考研数学知识库 PWA 已成功安装至系统！');
        if (installBtn) installBtn.style.display = 'none';
        if (mobileBanner) mobileBanner.style.display = 'none';
        deferredPrompt = null;
      });
    })();
  </script>

  <!-- PWA Mobile Install Floating Prompt -->
  <div id="pwaMathMobileBanner" style="display:none; position:fixed; bottom:20px; left:14px; right:14px; background:linear-gradient(135deg, #1e293b, #0f172a); border:1px solid #10b981; border-radius:14px; padding:12px 16px; box-shadow:0 10px 32px rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:space-between; gap:10px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="font-size:24px;">📐</span>
      <div>
        <div style="font-size:13px; font-weight:700; color:#f1f5f9;">安装考研数学 SOP 知识库</div>
        <div style="font-size:11px; color:#94a3b8;">秒速打开 · 离线随时背公式做真题</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button id="pwaMathBannerInstallBtn" style="background:linear-gradient(135deg,#10b981,#059669); color:#fff; border:none; border-radius:8px; padding:6px 14px; font-size:12px; font-weight:700; cursor:pointer;">立即安装</button>
      <button id="pwaMathBannerCloseBtn" style="background:transparent; color:#94a3b8; border:none; font-size:16px; cursor:pointer; padding:4px;">✕</button>
    </div>
  </div>
</body>
